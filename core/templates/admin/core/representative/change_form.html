{% extends "admin/change_form.html" %}

{% block content %}
{{ block.super }}

<script>
var CASCADE_DATA = {
    districts: {{ districts_json|safe }}
};

(function () {
    function init() {
        var $ = django.jQuery;

        // Bitta cascade — viloyat → tuman. Idlar bo'yicha topadi.
        function setupCascade(regionId, districtId, labels) {
            var $r = $('#' + regionId);
            var $d = $('#' + districtId);
            if (!$r.length || !$d.length) return;

            var savedD = $d.val();

            // Select2 ni olib tashlash (oddiy native select ishlashi uchun)
            [$r, $d].forEach(function ($el) {
                if ($el.data('select2')) {
                    $el.select2('destroy');
                }
            });

            function fill($sel, items, saved, ph) {
                $sel.empty().append('<option value="">' + ph + '</option>');
                (items || []).forEach(function (item) {
                    var sel = String(item.id) === String(saved) ? ' selected' : '';
                    $sel.append('<option value="' + item.id + '"' + sel + '>' + item.name + '</option>');
                });
            }

            $r[0].onchange = function () {
                savedD = '';
                fill($d, CASCADE_DATA.districts[this.value] || [], '', labels.pickDistrict);
            };

            // Sahifa yuklanganda — joriy holatga ko'ra dropdownni to'ldirish
            if ($r.val()) {
                fill($d, CASCADE_DATA.districts[$r.val()] || [], savedD, labels.pickDistrict);
            } else {
                fill($d, [], '', labels.pickRegionFirst);
            }
        }

        var residenceLabels = {
            pickDistrict: '-- Yashash tumanini tanlang --',
            pickRegionFirst: '-- Avval viloyat tanlang --',
        };
        var birthLabels = {
            pickDistrict: "-- Tug'ilgan tumani --",
            pickRegionFirst: '-- Avval viloyat tanlang --',
        };

        setupCascade('id_region', 'id_residence_district', residenceLabels);
        setupCascade('id_birth_region', 'id_birth_district', birthLabels);

        console.log('[CASCADE] Yashash va tug\'ilgan joyi cascadelari tayyor');
    }

    window.addEventListener('load', function () {
        setTimeout(init, 500);
    });
})();
</script>
{% endblock %}
